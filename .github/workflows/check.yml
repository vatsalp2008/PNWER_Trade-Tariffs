name: Check pipeline and site

# Runs every test, the linter and the site build on each pull request (and on any push
# to main by a person), so a broken change shows a red X before or as soon as it lands.
# The daily refresh commits are pushed with the workflow token, which doesn't trigger this.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # Without these, the corridor and counter-tariff tests skip themselves.
      - name: Install pipeline packages
        run: pip install -r pipeline/requirements.txt

      - name: Pipeline tests
        run: python -m unittest discover -s pipeline/tests -v

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install site packages
        working-directory: prototype
        run: npm ci

      - name: Data tests (B.C./Alberta, Washington/Idaho, corridors, counter-tariffs)
        working-directory: prototype
        run: npm run test:data

      - name: Lint
        working-directory: prototype
        run: npm run lint

      - name: Type-check and build the site
        working-directory: prototype
        run: npm run build
